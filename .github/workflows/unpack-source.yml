name: Unpack source

on:
  push:
    branches: [ main ]
    paths:
      - 'source_parts/part05.b64'
      - 'source_parts/part08.b64'
      - 'source_parts/part09.b64'
      - 'source_parts/part13.b64'
      - '.github/workflows/unpack-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify source package
        run: python prepare_source.py

      - name: Replace transfer parts with real project files
        run: |
          rm -rf source_parts
          rm -f prepare_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Giải nén và chuẩn hóa mã nguồn V10.3"
          git push
