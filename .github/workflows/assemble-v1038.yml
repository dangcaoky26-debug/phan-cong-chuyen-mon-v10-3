name: Assemble V10.3.8

on:
  push:
    branches: [deploy-v1038]
    paths:
      - '.deploy/v1038/**'
      - '.github/workflows/assemble-v1038.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify V10.3.8
        shell: bash
        run: |
          if [ ! -f .deploy/v1038/part00 ]; then
            echo "Chunks already assembled; nothing to do."
            exit 0
          fi
          cat .deploy/v1038/part* | base64 -d > /tmp/v1038.tar.xz
          echo "515e34823fdfae23e9e8165064eaf912e7390aac936af8563833f4374b69b187  /tmp/v1038.tar.xz" | sha256sum -c -
          rm -rf /tmp/v1038
          mkdir -p /tmp/v1038
          tar -xJf /tmp/v1038.tar.xz -C /tmp/v1038
          cp -a /tmp/v1038/. .
          python -m py_compile phan_cong_v10_3_dragdrop.py phan_cong_v10_3_8.py
          grep -q 'index_v10_3_8.html' phan_cong_v10_3_dragdrop.py
          grep -q 'V10.3.8' index_v10_3_8.html
          test ! -f phan_cong_v10_3.db
          rm -rf __pycache__ .deploy
          rm -f DEPLOY_V10_3_8.md DEPLOY_STATUS.md TEMP_NOTE.md README_DEPLOY_V10_3_8.md v10_3_8_bundle_REAL.zip.txt v10_3_8_bundle.zip
          rm -f .github/workflows/unpack-v1038.yml

      - name: Commit assembled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
          else
            git commit -m "Cập nhật V10.3.8 tối ưu hiệu năng"
            git push origin HEAD:deploy-v1038
          fi
