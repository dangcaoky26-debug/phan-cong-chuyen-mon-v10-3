name: Unpack and publish V10.3.8

on:
  push:
    branches: [main]
    paths:
      - 'v10_3_8_bundle.zip'
      - '.github/workflows/unpack-v1038.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack V10.3.8 bundle
        run: |
          rm -rf /tmp/v1038
          mkdir -p /tmp/v1038
          unzip -q -o v10_3_8_bundle.zip -d /tmp/v1038
          cp -a /tmp/v1038/. .

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Triển khai V10.3.8 tối ưu hiệu năng"
            git push origin HEAD:main
          fi
