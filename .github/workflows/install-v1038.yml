name: Install V10.3.8 project

on:
  push:
    branches: [main]
    paths:
      - 'deploy_chunks/**'
      - '.github/workflows/install-v1038.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and install V10.3.8
        shell: bash
        run: |
          set -euo pipefail
          cat deploy_chunks/part*.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          mkdir -p /tmp/v1038
          tar -xJf /tmp/project.tar.xz -C /tmp/v1038
          cp -a /tmp/v1038/. .
          rm -rf deploy_chunks
          rm -f v10_3_8_bundle.zip
          rm -f .github/workflows/unpack-v1038.yml
          rm -f .github/workflows/install-v1038.yml

      - name: Commit installed project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nâng cấp dự án lên V10.3.8 tối ưu hiệu năng"
            git push origin HEAD:main
          fi
